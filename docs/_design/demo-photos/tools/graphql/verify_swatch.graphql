query DemoVerifySwatch($handle: String!) {
  productByIdentifier(identifier: { handle: $handle }) {
    id
    category {
      fullName
    }
    variantsCount {
      count
    }
    options {
      name
      linkedMetafield {
        namespace
        key
      }
      optionValues {
        name
        swatch {
          color
        }
      }
    }
  }
}
